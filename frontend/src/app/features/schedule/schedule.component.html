<div class="page">
  <section class="content">
    <h1>Műsorlista</h1>

    <div *ngIf="loading" class="state loading">
      <p>Műsorlista betöltése...</p>
    </div>

    <div *ngIf="error" class="state error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="!loading && groups.length === 0" class="state empty">
      <p>Jelenleg nincs elérhető műsor.</p>
    </div>

    <div *ngFor="let group of groups" class="day-group">
      <div class="day-header">
        <h2>{{ group.label }}</h2>
        <span>{{ group.dayLabel }}</span>
      </div>

      <div class="showtime-grid">
        <a class="showtime-card" *ngFor="let showtime of group.showtimes" [routerLink]="'/movies/' + showtime.movie.id">
          <img *ngIf="showtime.movie.poster_path" [src]="showtime.movie.poster_path" [alt]="showtime.movie.title" />
          <div class="info">
            <div class="title">{{ showtime.movie.title }}</div>
            <app-movie-badges [badges]="showtime.movie.badges"></app-movie-badges>
            <div class="film-info" *ngIf="showtime.movie.film_info">{{ showtime.movie.film_info }}</div>
            <div class="time">{{ showtime.starts_at | date:'HH:mm' }}</div>
          </div>
        </a>
      </div>
    </div>
  </section>

</div>
