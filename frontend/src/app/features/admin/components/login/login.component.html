<div class="admin-login-container">
  <div class="login-card">
    <div class="logo-wrap">
      <img class="logo" src="assets/vigado_logo_beige.png" alt="Vigadó Jegy" />
    </div>
    <p class="subtitle">Adminisztrátor felület</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="admin&#64;vigadojegy.hu"
          class="form-input"
        />
        <span class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Érvénytelen email
        </span>
      </div>

      <div class="form-group">
        <label>Jelszó</label>
        <input 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          class="form-input"
        />
        <span class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          A jelszó legalább 6 karakter
        </span>
      </div>

      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <button 
        type="submit" 
        class="btn-login"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="loading">⏳ Bejelentkezés...</span>
        <span *ngIf="!loading">🔓 Bejelentkezés</span>
      </button>
    </form>
  </div>
</div>
