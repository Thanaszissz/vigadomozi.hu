<div class="page">
  <section class="content">
    <h1>Filmek</h1>

    <div *ngIf="loading" class="state loading">
      <p>Filmek betöltése...</p>
    </div>

    <div *ngIf="error" class="state error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="!loading && filteredMovies.length > 0" class="movies-grid">
      <div *ngFor="let movie of filteredMovies" class="movie-card">
        <div class="movie-poster">
          <img *ngIf="movie.poster_path" [src]="movie.poster_path" [alt]="movie.title">
          <div *ngIf="!movie.poster_path" class="no-poster">Nincs poszter</div>
        </div>
        <div class="movie-info">
          <h2>{{ movie.title }}</h2>
          <p class="film-info" *ngIf="movie.film_info">{{ movie.film_info }}</p>
          <p class="duration" *ngIf="movie.duration_min">⏱️ {{ movie.duration_min }} perc</p>
          <p class="description">{{ movie.description | slice:0:100 }}...</p>
          <div class="actions">
            <a [routerLink]="'/movies/' + movie.id" class="btn btn-primary">Részletek &amp; Jegyrendelés</a>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && movies.length === 0" class="state empty">
      <p>Jelenleg nincs elérhető film.</p>
    </div>

    <div *ngIf="!loading && movies.length > 0 && filteredMovies.length === 0" class="state empty">
      <p>Nincs találat a keresésre: "{{ searchTerm }}"</p>
    </div>
  </section>

</div>
